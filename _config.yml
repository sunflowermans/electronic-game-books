title: Just the Games
description: Gaming reference site with a suite of tools for running and reading with ease.
theme: just-the-docs

url: https://games.puzzledungeon.com

# Aux links for the upper right navigation
aux_links:
  "Return to the Puzzle Dungeon blog":
    - "https://puzzledungeon.com/"

# External navigation links
nav_external_links:
  - title: Cairn Rules
    url: https://cairn.puzzledungeon.com

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Just the Docs only emits the Ctrl/Cmd+K listener when this is set.
search_enabled: true
search:
  focus_shortcut_key: "k"

# documents are under /docs
defaults:
  - scope:
      path: "docs"
      type: "pages"
    values:
      layout: "default"

footer_content: "Fonts, colors and styles for this site are based on the <a href=\"https://dungeons.hismajestytheworm.games\">Designing Dungeons course</a> and are used with permission."

plugins:
  - jekyll-redirect-from
  - jekyll-jtd-toc-nav # headers in the nav bar
  - jekyll-dice-tray # dice tray widget
  - jekyll-hover-popup # preview popup windows for internal links
  - jekyll-image-links # hyperlinked maps
  - rpg-callouts # additional callout formatting options
  - dark-dungeons-theme # dark overlay for the default theme

#exclude:
#  - /docs/ose-rules # exclude for faster local builds
